
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViralClip AI</title>
<style>
body{background:#10101b;color:white;font-family:Arial;padding:20px}
h1{color:#a78bfa;text-align:center}
.card{background:#202035;padding:18px;border-radius:15px;margin:15px 0}
button,.upload{display:block;background:#8055ee;color:white;padding:14px;border:0;border-radius:9px;margin:12px 0;width:100%;text-align:center;font-weight:bold}
input{width:100%;margin:12px 0;color:white}
video{width:100%;max-height:350px}
p{color:#bbb}
</style>
</head>
<body>
<h1>VIRALCLIP AI</h1>
<p style="text-align:center">Free AI Video Studio</p>

<div class="card">
<h3>01. Upload Video</h3>
<label class="upload" for="file">Choose iPhone Video</label>
<input id="file" type="file" accept="video/*" hidden>
<video id="preview" controls playsinline></video>
<p id="info">No video selected</p>
</div>

<div class="card">
<h3>02. Clip Settings</h3>
<label>Start time (seconds)</label>
<input id="start" type="number" value="0" min="0">
<label>Duration (seconds)</label>
<input id="duration" type="number" value="10" min="1" max="60">
<button id="load">Load Free Video Engine</button>
<button id="export" disabled>Export MP4 Clip</button>
<p id="status">Ready</p>
</div>

<div class="card">
<h3>03. Exported Video</h3>
<video id="result" controls playsinline></video>
<a id="save" hidden style="color:#c4b5fd">Save MP4 to iPhone</a>
</div>

<script type="module">
import { FFmpeg } from
'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { fetchFile, toBlobURL } from
'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

const ffmpeg = new FFmpeg();
const file = document.getElementById('file');
const status = document.getElementById('status');
const loadBtn = document.getElementById('load');
const exportBtn = document.getElementById('export');
let selectedFile = null;
let loaded = false;
let resultURL = null;

file.onchange = () => {
 selectedFile = file.files[0];
 if(!selectedFile)return;
 document.getElementById('preview').src =
 URL.createObjectURL(selectedFile);
 document.getElementById('info').textContent =
 selectedFile.name + ' • ' +
 (selectedFile.size/1048576).toFixed(1) + ' MB';
};

loadBtn.onclick = async () => {
 try {
  loadBtn.disabled = true;
  status.textContent = 'Downloading video engine... Please wait.';
  const base =
  'https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd';
  await ffmpeg.load({
   coreURL: await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),
   wasmURL: await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')
  });
  loaded = true;
  exportBtn.disabled = false;
  status.textContent = 'Video engine ready!';
  loadBtn.textContent = 'Engine Loaded';
 } catch(e) {
  status.textContent = 'Engine loading failed: '+e.message;
  loadBtn.disabled = false;
 }
};

exportBtn.onclick = async () => {
 if(!selectedFile || !loaded)return;
 try {
  exportBtn.disabled = true;
  status.textContent = 'Processing video... Keep Safari open.';
  const ext = selectedFile.name.split('.').pop().toLowerCase()
   .replace(/[^a-z0-9]/g,'') || 'mp4';
  await ffmpeg.writeFile('input.'+ext,await fetchFile(selectedFile));
  const s = Math.max(0,Number(document.getElementById('start').value)||0);
  const d = Math.max(1,Math.min(60,Number(document.getElementById('duration').value)||10));
  await ffmpeg.exec([
   '-ss',String(s),
   '-i','input.'+ext,
   '-t',String(d),
   '-c:v','libx264',
   '-preset','ultrafast',
   '-c:a','aac',
   '-movflags','+faststart',
   'output.mp4'
  ]);
  const data = await ffmpeg.readFile('output.mp4');
  if(resultURL)URL.revokeObjectURL(resultURL);
  resultURL = URL.createObjectURL(
   new Blob([data],{type:'video/mp4'})
  );
  document.getElementById('result').src=resultURL;
  const save=document.getElementById('save');
  save.href=resultURL;
  save.download='viralclip.mp4';
  save.hidden=false;
  save.textContent='Download MP4 to iPhone';
  status.textContent='Export successful!';
 } catch(e) {
  status.textContent='Export failed: '+e.message;
 } finally {
  exportBtn.disabled=false;
 }
};
</script>
</body>
</html>
